# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Krushi Seva Kendra

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:krushiseva
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging
logging.level.root=INFO
logging.level.com.krushiseva=INFO
logging.level.org.springframework.security=INFO

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Configuration
app.shop.name=Saptashrungi Agro Services
app.shop.name.mr=सप्तशृंगी ॲग्रो सर्व्हिसेस
app.shop.phone=+91 8600813827
app.shop.address=Mirakhnagar, Vaijapur, Chhatrapati Sambhajinagar, Maharashtra - 423703

# Meta WhatsApp Cloud API reminders (disabled until credentials, template and consent are configured)
app.whatsapp-reminders.enabled=${WHATSAPP_REMINDERS_ENABLED:false}
app.whatsapp-reminders.access-token=${WHATSAPP_CLOUD_API_ACCESS_TOKEN:}
app.whatsapp-reminders.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp-reminders.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v22.0}
app.whatsapp-reminders.template-name=${WHATSAPP_REMINDER_TEMPLATE_NAME:}
app.whatsapp-reminders.template-language=${WHATSAPP_REMINDER_TEMPLATE_LANGUAGE:en}
app.whatsapp-reminders.cron=${WHATSAPP_REMINDER_CRON:0 0 9 * * *}
