<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Admin - Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
    <header th:replace="~{layout/navbar :: navbar}"></header>
    <aside th:replace="~{layout/sidebar-admin :: sidebar('categories')}"></aside>

    <main class="container-fluid py-4 premium-dashboard-content">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2 class="h3 fw-bold">Categories</h2>
            </div>
            <div class="col-md-4 text-end">
                <a href="/admin/categories/create" class="btn btn-success">Add Category</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${categories.isEmpty()}" class="alert alert-info">
                    No categories found.
                </div>
                <div th:unless="${categories.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Marathi Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.name}">Name</td>
                                <td th:text="${cat.nameMr}">Marathi</td>
                                <td th:text="${cat.description}">Description</td>
                                <td>
                                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form method="post" th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" class="d-inline"
                                          onsubmit="return confirm('Are you sure?')">
                                        <button type="submit" class="btn btn-sm btn-danger" aria-label="Delete category">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
