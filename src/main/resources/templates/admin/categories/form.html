<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Form - Admin - Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
    <header th:replace="~{layout/navbar :: navbar}"></header>
    <aside th:replace="~{layout/sidebar-admin :: sidebar('categories')}"></aside>

    <main class="container-fluid py-4 premium-dashboard-content">
        <h2 class="mb-4">
            <span th:if="${category.id == null}">Add Category</span>
            <span th:unless="${category.id == null}">Edit Category</span>
        </h2>

        <div class="card">
            <div class="card-body">
                <form th:if="${category.id == null}" method="post" th:action="@{/admin/categories/save}">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" name="name" th:value="${category.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Marathi Name</label>
                        <input type="text" class="form-control" name="nameMr" th:value="${category.nameMr}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bootstrap icon class</label>
                        <input type="text" class="form-control" name="iconClass" th:value="${category.iconClass}" placeholder="bi bi-flower1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Short description</label>
                        <input type="text" class="form-control" name="shortDescription" th:value="${category.shortDescription}" maxlength="500">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3" th:text="${category.description}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="/admin/categories" class="btn btn-secondary">Cancel</a>
                </form>

                <form th:unless="${category.id == null}" method="post" th:action="@{/admin/categories/update/{id}(id=${category.id})}">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" name="name" th:value="${category.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Marathi Name</label>
                        <input type="text" class="form-control" name="nameMr" th:value="${category.nameMr}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bootstrap icon class</label>
                        <input type="text" class="form-control" name="iconClass" th:value="${category.iconClass}" placeholder="bi bi-flower1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Short description</label>
                        <input type="text" class="form-control" name="shortDescription" th:value="${category.shortDescription}" maxlength="500">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3" th:text="${category.description}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Update</button>
                    <a href="/admin/categories" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
