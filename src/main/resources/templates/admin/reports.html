<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports | Agro Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
<header th:replace="~{layout/navbar :: navbar}"></header>
<aside th:replace="~{layout/sidebar-admin :: sidebar('reports')}"></aside>
<main class="container-fluid py-4 premium-dashboard-content">
    <div class="admin-page-heading"><div><span class="admin-eyebrow">SHOP PERFORMANCE</span><h1>Reports</h1><p>Successful recorded payments grouped by month.</p></div></div>
    <section class="card admin-panel-card">
        <div class="card-header"><h2 class="h5 mb-0">Six-month payment totals</h2></div>
        <div class="table-responsive"><table class="table align-middle admin-table mb-0"><thead><tr><th>Month</th><th class="text-end">Payments recorded</th></tr></thead>
            <tbody><tr th:each="label, stat : ${chartLabels}"><th scope="row" th:text="${label}">2026-10</th><td class="text-end fw-semibold" th:text="${'₹' + #numbers.formatDecimal(chartValues[stat.index], 1, 2)}">₹0.00</td></tr></tbody>
        </table></div>
    </section>
    <section class="card admin-panel-card mt-4"><div class="card-body d-flex flex-wrap justify-content-between gap-3"><strong>Successful payments today</strong><strong class="text-success" th:text="${'₹' + #numbers.formatDecimal(todayPayments, 1, 2)}">₹0.00</strong></div></section>
</main>
</body>
</html>
