<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enquiries | Agro Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
<header th:replace="~{layout/navbar :: navbar}"></header>
<aside th:replace="~{layout/sidebar-admin :: sidebar('enquiries')}"></aside>
<main class="container-fluid py-4 premium-dashboard-content">
    <div class="admin-page-heading"><div><span class="admin-eyebrow">CUSTOMER SUPPORT</span><h1>Enquiries</h1><p>Online product orders are not supported; customers enquire by phone or WhatsApp.</p></div></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
    <section class="card admin-panel-card">
        <div class="card-body p-0">
            <div class="admin-empty-state" th:if="${enquiries.isEmpty()}">
                <i class="bi bi-chat-square-text"></i>
                <strong>No enquiries yet</strong>
                <span>New contact requests will appear here and open WhatsApp for follow-up.</span>
                <a class="btn btn-success mt-3" href="https://wa.me/918600813827" target="_blank" rel="noopener noreferrer"><i class="bi bi-whatsapp me-2"></i>Open shop WhatsApp</a>
            </div>
            <div class="table-responsive" th:unless="${enquiries.isEmpty()}">
                <table class="table align-middle admin-table mb-0">
                    <thead><tr><th>Received</th><th>Customer</th><th>Message</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="enquiry : ${enquiries}">
                        <td th:text="${#temporals.format(enquiry.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                        <td><strong th:text="${enquiry.name}">Name</strong><a class="d-block small" th:href="${'tel:' + enquiry.phone}" th:text="${enquiry.phone}">Phone</a></td>
                        <td class="enquiry-message" th:text="${enquiry.message}">Message</td>
                        <td><span class="admin-status" th:classappend="${enquiry.handled ? 'admin-status--active' : 'admin-status--pending'}" th:text="${enquiry.handled ? 'Handled' : 'New'}">New</span></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-success" th:href="${'https://wa.me/' + enquiry.whatsappNumber}" target="_blank" rel="noopener noreferrer" aria-label="Contact customer on WhatsApp"><i class="bi bi-whatsapp"></i></a>
                            <form th:if="${!enquiry.handled}" method="post" th:action="@{/admin/enquiries/{id}/mark-handled(id=${enquiry.id})}" class="d-inline">
                                <button class="btn btn-sm btn-success" type="submit">Mark handled</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
