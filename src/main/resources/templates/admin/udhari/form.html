<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udhari Form - Admin - Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Krushi Seva Kendra</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Add Credit Entry</h2>

        <div class="card">
            <div class="card-body">
                <form method="post" th:action="@{/admin/udhari/save}">
                    <div class="mb-3">
                        <label class="form-label">Farmer</label>
                        <select class="form-control" name="userId" required>
                            <option value="">-- Select Farmer --</option>
                            <option th:each="farmer : ${farmers}" th:value="${farmer.id}" th:text="${farmer.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Credit Amount</label>
                        <input type="number" class="form-control" name="amount" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" class="form-control" name="dueDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" name="status">
                            <option value="PENDING">Pending</option>
                            <option value="PARTIAL">Partial</option>
                            <option value="PAID">Paid</option>
                            <option value="OVERDUE">Overdue</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Save Credit</button>
                    <a href="/admin/udhari" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
