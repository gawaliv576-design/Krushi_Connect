<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form - Admin - Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
    <header th:replace="~{layout/navbar :: navbar}"></header>
    <aside th:replace="~{layout/sidebar-admin :: sidebar('payments')}"></aside>

    <main class="container-fluid py-4 premium-dashboard-content">
        <h2 class="mb-4">Record Payment</h2>

        <div class="card">
            <div class="card-body">
                <form method="post" th:action="@{/admin/payments/save}">
                    <div class="mb-3">
                        <label class="form-label">Farmer</label>
                        <select class="form-control" name="userId" required>
                            <option value="">-- Select Farmer --</option>
                            <option th:each="farmer : ${farmers}" th:value="${farmer.id}" th:text="${farmer.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" class="form-control" name="amount" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select class="form-control" name="method">
                            <option value="CASH">Cash</option>
                            <option value="CHECK">Check</option>
                            <option value="BANK_TRANSFER">Bank Transfer</option>
                            <option value="UPI">UPI</option>
                            <option value="CREDIT_CARD">Credit Card</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" name="status">
                            <option value="SUCCESS">Success</option>
                            <option value="PENDING">Pending</option>
                            <option value="FAILED">Failed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Save Payment</button>
                    <a href="/admin/payments" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
