<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers - Admin - Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="admin-page">
    <header th:replace="~{layout/navbar :: navbar}"></header>
    <aside th:replace="~{layout/sidebar-admin :: sidebar('farmers')}"></aside>

    <main class="container-fluid py-4 premium-dashboard-content">
        <h2 class="h3 fw-bold mb-4">
            <i class="bi bi-people me-2"></i>Farmers Directory
        </h2>

        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${farmers.isEmpty()}" class="alert alert-info">
                    No farmers registered yet.
                </div>
                <div th:unless="${farmers.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Village</th>
                                <th>District</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="farmer : ${farmers}">
                                <td th:text="${farmer.name}">Name</td>
                                <td th:text="${farmer.email}">Email</td>
                                <td th:text="${farmer.phone}">Phone</td>
                                <td th:text="${farmer.village}">Village</td>
                                <td th:text="${farmer.district}">District</td>
                                <td>
                                    <span th:if="${farmer.isActive}" class="badge bg-success">Active</span>
                                    <span th:unless="${farmer.isActive}" class="badge bg-danger">Inactive</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5 text-center">
        <p class="mb-0 small">&copy; 2024 Krushi Seva Kendra. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
