<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Method not allowed | Krushi Seva Kendra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{layout/header :: premiumAssets}"></th:block>
</head>
<body class="public-page">
<main class="container min-vh-100 d-grid align-items-center py-5">
    <section class="glass-card mx-auto p-5 text-center" style="max-width: 620px">
        <span class="display-1 fw-bold text-warning">405</span><h1>Action not allowed</h1>
        <p class="text-muted" th:text="${errorMessage}">This action does not support the requested method.</p>
        <a class="btn btn-success" th:href="@{/}">Return to the shop</a>
    </section>
</main>
</body>
</html>
