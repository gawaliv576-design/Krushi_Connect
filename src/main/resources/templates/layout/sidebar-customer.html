<aside xmlns:th="http://www.thymeleaf.org"
       th:fragment="sidebar(activeItem)"
       class="premium-sidebar premium-customer-sidebar"
       aria-label="Customer navigation">
    <a class="premium-sidebar-brand" th:href="@{/farmer/dashboard}">
        <span class="premium-sidebar-brand-icon"><i class="bi bi-person-hearts"></i></span>
        <span><strong>My Farm</strong><small>Farmer workspace</small></span>
    </a>

    <p class="premium-sidebar-label">YOUR ACCOUNT</p>
    <nav class="premium-sidebar-nav">
        <a class="premium-sidebar-link" th:href="@{/farmer/dashboard}"
           th:classappend="${activeItem == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
        </a>
        <a class="premium-sidebar-link" th:href="@{/farmer/products}"
           th:classappend="${activeItem == 'products' ? 'active' : ''}">
            <i class="bi bi-box-seam"></i><span>Browse Products</span>
        </a>
        <a class="premium-sidebar-link" th:href="@{/farmer/udhari}"
           th:classappend="${activeItem == 'udhari' ? 'active' : ''}">
            <i class="bi bi-wallet2"></i><span>My Udhari</span>
        </a>
        <a class="premium-sidebar-link premium-sidebar-pay"
           th:href="@{/farmer/pay}"
           th:classappend="${activeItem == 'pay' ? 'active' : ''}">
            <i class="bi bi-qr-code-scan"></i><span>Pay Now (UPI)</span><i class="bi bi-arrow-up-right ms-auto"></i>
        </a>
        <a class="premium-sidebar-link" th:href="@{/farmer/payments}"
           th:classappend="${activeItem == 'payments' ? 'active' : ''}">
            <i class="bi bi-clock-history"></i><span>Payment History</span>
        </a>
        <a class="premium-sidebar-link" th:href="@{/farmer/profile}"
           th:classappend="${activeItem == 'profile' ? 'active' : ''}">
            <i class="bi bi-person-vcard"></i><span>Profile</span>
        </a>
        <a class="premium-sidebar-link" th:href="@{/farmer/dashboard#notifications}">
            <i class="bi bi-bell"></i><span>Notifications</span>
            <span class="premium-sidebar-badge" th:if="${notificationCount != null}" th:text="${notificationCount}">0</span>
        </a>
    </nav>

    <p class="premium-sidebar-label premium-sidebar-label-bottom">AGRI TOOLS</p>
    <nav class="premium-sidebar-nav">
        <a class="premium-sidebar-link" href="https://soilhealth.dac.gov.in/" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-calculator"></i><span>Fertilizer Calculator</span><i class="bi bi-arrow-up-right ms-auto"></i>
        </a>
        <a class="premium-sidebar-link" href="https://mausam.imd.gov.in/" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-cloud-sun"></i><span>Weather</span><i class="bi bi-arrow-up-right ms-auto"></i>
        </a>
        <a class="premium-sidebar-link" href="https://icar.org.in/" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-journal-richtext"></i><span>Crop Tips</span><i class="bi bi-arrow-up-right ms-auto"></i>
        </a>
    </nav>

    <div class="premium-sidebar-note">
        <i class="bi bi-lightbulb"></i>
        <p>Need a hand? Our local team is happy to help.</p>
        <a href="tel:+918600813827">Call the shop <i class="bi bi-arrow-right"></i></a>
    </div>
</aside>
