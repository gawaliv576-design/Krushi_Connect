# Netlify Deployment Configuration for Krushi Seva Kendra
# https://github.com/gawaliv576-design/Krushi_Connect

[build]
  # Static frontend root directory
  publish = "."

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URL Rewrites (Access /products directly without .html)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

